<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>JB Confeitaria · Contagem</title>
<meta name="description" content="Contagem da geladeira na abertura e no fechamento do turno.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E88870">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JB Contagem">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=Parisienne&display=swap">

<style>
/* ============================================================
   Identidade JB Confeitaria
   coral #E88870 · creme #F8F0E8 · blush #F8D8C0 · marrom #4A2C1B
   ============================================================ */
:root{
  --coral:#E88870;
  --coral-forte:#CE6B4F;
  --coral-fundo:#B85B41;
  --coral-veu:#FBE4DA;
  --creme:#FFFBF7;
  --areia:#F6E7DC;
  --blush:#F8D8C0;
  --tinta:#4A2C1B;
  --tinta-2:#7A5844;
  --tinta-3:#A98B76;
  --linha:#EDD9CB;
  --linha-2:#E0C4B1;
  --dourado:#C0955F;
  --verde:#3F6B52;
  --verde-veu:#E4EFE7;
  --ambar:#9A6B18;
  --ambar-veu:#FBEEDA;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--areia);
  color:var(--tinta);
  font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; font-weight:400; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0;letter-spacing:0;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
.app{max-width:560px;margin:0 auto;padding:0 16px;}
.hide{display:none!important;}

/* ---------- marca ---------- */
.selo{display:block;border-radius:50%;}
.wordmark{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:.01em;}
.caps{
  font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--tinta-3);font-weight:500;
}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;}
.top .marca{display:flex;align-items:center;gap:10px;}
.top .selo{width:34px;height:34px;}
.top .marca b{font-family:"Playfair Display",serif;font-weight:600;font-size:1.05rem;display:block;line-height:1.1;}
.top .marca span{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tinta-3);}
.who{
  display:flex;align-items:center;gap:8px;background:var(--creme);
  border:1px solid var(--linha);border-radius:999px;padding:5px 6px 5px 13px;
  font-size:.85rem;color:var(--tinta-2);
}
.who button{
  border:none;background:var(--coral-veu);color:var(--coral-forte);border-radius:999px;
  width:26px;height:26px;font-size:.85rem;line-height:1;
}

/* ---------- data ---------- */
.datebar{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:2px 0 18px;padding-bottom:13px;
  border-bottom:1px solid var(--linha);
}
.datebar .d{font-family:"Playfair Display",serif;font-size:1.45rem;font-weight:600;line-height:1.15;}
.datebar .h{font-size:.85rem;color:var(--tinta-3);font-variant-numeric:tabular-nums;}

/* ---------- botoes grandes ---------- */
.big{
  position:relative;display:block;width:100%;text-align:left;border:none;
  border-radius:var(--r);padding:20px 20px 20px 22px;margin-bottom:12px;
  color:var(--creme);background:var(--coral-forte);
  box-shadow:0 2px 0 var(--coral-fundo);
}
.big:active{transform:translateY(1px);box-shadow:0 1px 0 var(--coral-fundo);}
.big .t{font-family:"Playfair Display",serif;font-size:1.26rem;font-weight:600;display:block;line-height:1.2;}
.big .s{font-size:.88rem;opacity:.92;display:block;margin-top:3px;font-weight:300;}
.big.ghost{background:var(--creme);color:var(--tinta);border:1px solid var(--linha-2);box-shadow:none;}
.big.ghost .s{color:var(--tinta-3);opacity:1;}
.big.done{background:var(--verde-veu);color:var(--verde);border:1px solid #C4DCCC;box-shadow:none;}
.big.done .s{color:var(--verde);opacity:.85;}
.big[disabled]{opacity:.5;pointer-events:none;}

/* ---------- contagem ---------- */
.counthead{
  position:sticky;top:0;z-index:5;background:var(--areia);
  padding:14px 0 10px;border-bottom:1px solid var(--linha);margin-bottom:8px;
}
.counthead .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.counthead h2{font-size:1.14rem;}
.counthead .prog{font-size:.82rem;color:var(--tinta-3);font-variant-numeric:tabular-nums;}
.bar{height:4px;background:var(--linha);border-radius:999px;margin-top:9px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .2s;}

.item{
  display:flex;align-items:center;gap:10px;background:var(--creme);
  border:1px solid var(--linha);border-radius:13px;
  padding:10px 10px 10px 15px;margin-bottom:8px;
  border-left:3px solid var(--linha);
}
.item.filled{border-left-color:var(--coral);}
.item .nome{flex:1;min-width:0;font-size:.95rem;font-weight:400;line-height:1.28;}
.step{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.step button{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--linha-2);
  background:var(--creme);color:var(--tinta-2);font-size:1.15rem;font-weight:500;line-height:1;
}
.step button:active{background:var(--coral-veu);border-color:var(--coral);color:var(--coral-forte);}
.step input{
  width:56px;height:38px;border-radius:11px;border:1px solid var(--linha-2);
  text-align:center;font-family:inherit;font-size:1.05rem;font-weight:500;
  font-variant-numeric:tabular-nums;background:var(--creme);color:var(--tinta);
}
.step input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral);}

/* ---------- rodape fixo ---------- */
.foot{
  position:sticky;bottom:0;z-index:6;
  background:linear-gradient(to top,var(--areia) 72%,rgba(246,231,220,0));
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:6px;
}
.foot button{
  width:100%;border:none;border-radius:13px;padding:16px;
  background:var(--coral-forte);color:var(--creme);
  font-size:1.02rem;font-weight:500;box-shadow:0 2px 0 var(--coral-fundo);
}
.foot button[disabled]{background:var(--linha-2);color:var(--creme);box-shadow:none;}
.foot .link{
  display:block;width:100%;background:none;border:none;box-shadow:none;
  color:var(--tinta-3);font-size:.86rem;font-weight:300;padding:11px 0 0;text-decoration:underline;
}

/* ---------- login ---------- */
.login{padding-top:7vh;}
.login .mark{text-align:center;margin-bottom:30px;}
.login .selo{width:92px;height:92px;margin:0 auto 16px;}
.login .mark .nome{font-family:"Playfair Display",serif;font-size:1.85rem;font-weight:600;line-height:1.1;color:var(--tinta);}
.login .mark .sub{margin-top:7px;}
.login .mark .rule{
  width:52px;height:1px;background:var(--dourado);margin:15px auto 0;opacity:.6;
}
.pick{display:grid;gap:8px;margin-bottom:16px;}
.pick button{
  padding:15px 17px;border-radius:13px;border:1px solid var(--linha-2);background:var(--creme);
  text-align:left;font-size:1rem;font-weight:400;color:var(--tinta);
}
.pick button[aria-pressed="true"]{
  border-color:var(--coral);background:var(--coral-veu);color:var(--coral-forte);font-weight:500;
}
.pinrow{display:flex;gap:8px;}
.pinrow input{
  flex:1;padding:15px 16px;border-radius:13px;border:1px solid var(--linha-2);background:var(--creme);
  font-family:inherit;font-size:1.1rem;letter-spacing:.35em;text-align:center;color:var(--tinta);
}
.pinrow input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral);}
.pinrow button{
  padding:0 23px;border-radius:13px;border:none;background:var(--coral-forte);
  color:var(--creme);font-weight:500;box-shadow:0 2px 0 var(--coral-fundo);
}

/* ---------- avisos ---------- */
.msg{border-radius:11px;padding:11px 14px;font-size:.88rem;margin-bottom:12px;font-weight:300;}
.msg.err{background:var(--coral-veu);color:var(--coral-fundo);border:1px solid #F0C8BB;}
.msg.ok{background:var(--verde-veu);color:var(--verde);border:1px solid #C4DCCC;}
.msg.warn{background:var(--ambar-veu);color:var(--ambar);border:1px solid #EDD5A8;}

/* ---------- resultado ---------- */
.res{background:var(--creme);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.res .hd{background:var(--coral);color:var(--creme);padding:20px 20px 18px;text-align:center;}
.res .hd .script{
  font-family:"Parisienne",cursive;font-size:1.5rem;line-height:1;opacity:.95;display:block;
}
.res .hd .v{font-family:"Playfair Display",serif;font-size:2.3rem;font-weight:600;line-height:1.15;display:block;margin-top:2px;}
.res .hd .k{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;opacity:.9;display:block;margin-top:5px;}
.res .ln{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid var(--linha);font-size:.93rem;font-weight:300;}
.res .ln .q{font-variant-numeric:tabular-nums;font-weight:600;color:var(--coral-forte);flex:0 0 auto;}
.res .ln.zero{color:var(--tinta-3);}
.res .ln.zero .q{color:var(--tinta-3);font-weight:400;}

/* ---------- historico ---------- */
.card{background:var(--creme);border:1px solid var(--linha);border-radius:var(--r);padding:6px 18px;}
.hist{font-size:.92rem;}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--linha);}
.hist .h:first-child{border-top:none;}
.hist .h .dt{font-weight:500;}
.hist .h .st{color:var(--tinta-3);font-size:.85rem;font-weight:300;}
.hist .h .st.ok{color:var(--verde);}

.tip{color:var(--tinta-3);font-size:.84rem;font-weight:300;margin:12px 2px 20px;line-height:1.5;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="app">

  <!-- ================= LOGIN ================= -->
  <section id="scLogin" class="login hide">
    <div class="mark">
      <img class="selo" src="icon-192.png" alt="" width="92" height="92">
      <div class="nome">Jessica Ballassa</div>
      <div class="sub caps">Confeitaria</div>
      <div class="rule"></div>
    </div>
    <div id="loginErr" class="msg err hide"></div>
    <div class="pick" id="pickWho"></div>
    <div class="pinrow">
      <input id="pin" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="current-password">
      <button id="btnEntrar">Entrar</button>
    </div>
    <p class="tip">Digite uma vez e o celular guarda. Da próxima vez já abre direto.</p>
  </section>

  <!-- ================= HOME ================= -->
  <section id="scHome" class="hide">
    <div class="top">
      <div class="marca">
        <img class="selo" src="icon-192.png" alt="" width="34" height="34">
        <div><b>Jessica Ballassa</b><span>Contagem de turno</span></div>
      </div>
      <div class="who"><span id="whoName"></span><button id="btnSair" title="Sair">↩</button></div>
    </div>
    <div class="datebar">
      <span class="d" id="hoje"></span>
      <span class="h" id="agora"></span>
    </div>
    <div id="homeMsg"></div>
    <button class="big" id="btnAbertura">
      <span class="t">Deixando pronto</span>
      <span class="s">Conte o que está na geladeira agora</span>
    </button>
    <button class="big ghost" id="btnFechamento">
      <span class="t">Fechando o turno</span>
      <span class="s">Conte o que sobrou no fim da noite</span>
    </button>
    <button class="big ghost" id="btnHist">
      <span class="t">Últimos dias</span>
      <span class="s">O que saiu em cada dia</span>
    </button>
    <p class="tip">Conte item por item, sem pressa. Se errar, dá para corrigir no mesmo dia.</p>
  </section>

  <!-- ================= CONTAGEM ================= -->
  <section id="scCount" class="hide">
    <div class="counthead">
      <div class="row1">
        <h2 id="countTitle"></h2>
        <span class="prog" id="countProg"></span>
      </div>
      <div class="bar"><i id="countBar"></i></div>
    </div>
    <div id="countMsg"></div>
    <div id="countList"></div>
    <div class="foot">
      <button id="btnSalvar">Salvar contagem</button>
      <button class="link" id="btnVoltar">Voltar sem salvar</button>
    </div>
  </section>

  <!-- ================= RESULTADO ================= -->
  <section id="scRes" class="hide">
    <div class="top">
      <div class="marca">
        <img class="selo" src="icon-192.png" alt="" width="34" height="34">
        <div><b>Jessica Ballassa</b><span>Resultado do turno</span></div>
      </div>
    </div>
    <div id="resBox"></div>
    <div class="foot"><button id="btnResOk">Concluir</button></div>
  </section>

  <!-- ================= HISTÓRICO ================= -->
  <section id="scHist" class="hide">
    <div class="top">
      <div class="marca">
        <img class="selo" src="icon-192.png" alt="" width="34" height="34">
        <div><b>Jessica Ballassa</b><span>Últimos dias</span></div>
      </div>
    </div>
    <div class="card hist" id="histList"></div>
    <div class="foot"><button id="btnHistVoltar">Voltar</button></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */
const SUPABASE_URL = "https://yudtseanlkhxkmnranmg.supabase.co";
const SUPABASE_KEY = "sb_publishable_M77s2Y-DZGl0xLZYYGKniA_ZdkxBO8O";

const LOGINS = [
  { nome: "Jessica",  email: "jessica@jbconfeitaria.app"  },
  { nome: "Delivery", email: "delivery@jbconfeitaria.app" },
  { nome: "Henrique", email: "henrique@jbconfeitaria.app" }
];

const TZ = "America/Sao_Paulo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = id => document.getElementById(id);
const SC = ["scLogin","scHome","scCount","scRes","scHist"];
function show(id){ SC.forEach(s => $(s).classList.toggle("hide", s !== id)); window.scrollTo(0,0); }

function hojeSP(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function horaSP(){
  return new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date());
}
function dataLonga(iso){
  const [a,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(a,m-1,d,12));
  const s = new Intl.DateTimeFormat("pt-BR",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"}).format(dt);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dataCurta(iso){
  const [a,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(a,m-1,d,12));
  return new Intl.DateTimeFormat("pt-BR",{timeZone:"UTC",weekday:"short",day:"2-digit",month:"2-digit"}).format(dt);
}
function aviso(alvo, texto, tipo){
  const el = $(alvo);
  if(!texto){ el.innerHTML = ""; return; }
  el.innerHTML = '<div class="msg ' + tipo + '"></div>';
  el.firstChild.textContent = texto;
}

/* ============================================================
   ESTADO
   ============================================================ */
let EU = null;
let PRODUTOS = [];
let MOMENTO = null;
let VALORES = {};
let CONTAGEM_HOJE = {};

const rascunhoKey = () => "jb_rascunho_" + hojeSP() + "_" + MOMENTO;

/* ============================================================
   LOGIN
   ============================================================ */
let escolhido = null;

function montarLogin(){
  const box = $("pickWho");
  box.innerHTML = "";
  LOGINS.forEach(l => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = l.nome;
    b.setAttribute("aria-pressed","false");
    b.onclick = () => {
      escolhido = l;
      [...box.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      $("pin").focus();
    };
    box.appendChild(b);
  });
  const ultimo = localStorage.getItem("jb_ultimo");
  if(ultimo){
    const i = LOGINS.findIndex(l => l.email === ultimo);
    if(i >= 0) box.children[i].click();
  }
}

async function entrar(){
  const pin = $("pin").value.trim();
  $("loginErr").classList.add("hide");
  if(!escolhido){ erroLogin("Toque no seu nome primeiro."); return; }
  if(pin.length < 6){ erroLogin("O PIN tem 6 números."); return; }
  $("btnEntrar").disabled = true;
  $("btnEntrar").textContent = "...";
  const { error } = await sb.auth.signInWithPassword({ email: escolhido.email, password: pin });
  $("btnEntrar").disabled = false;
  $("btnEntrar").textContent = "Entrar";
  if(error){ erroLogin("PIN incorreto. Tente de novo."); $("pin").value = ""; return; }
  localStorage.setItem("jb_ultimo", escolhido.email);
  $("pin").value = "";
  await iniciar();
}
function erroLogin(t){ const e = $("loginErr"); e.textContent = t; e.classList.remove("hide"); }

/* ============================================================
   CARGA
   ============================================================ */
async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ montarLogin(); show("scLogin"); return; }

  const { data: u, error: eu } = await sb.from("jb_usuario")
    .select("user_id,nome,papel").eq("user_id", session.user.id).maybeSingle();
  if(eu || !u){
    await sb.auth.signOut();
    montarLogin(); show("scLogin");
    erroLogin("Este acesso ainda não foi liberado. Fale com o Henrique.");
    return;
  }
  EU = u;

  const { data: p } = await sb.from("jb_produto").select("id,nome,ordem").eq("ativo", true).order("ordem");
  PRODUTOS = p || [];

  await carregarHome();
}

async function carregarHome(){
  $("whoName").textContent = EU.nome;
  $("hoje").textContent = dataLonga(hojeSP());
  $("agora").textContent = horaSP();

  const { data } = await sb.from("jb_contagem")
    .select("id,momento,nome_responsavel,criado_em").eq("data", hojeSP());
  CONTAGEM_HOJE = { abertura:null, fechamento:null };
  (data || []).forEach(c => CONTAGEM_HOJE[c.momento] = c);

  const ab = CONTAGEM_HOJE.abertura, fe = CONTAGEM_HOJE.fechamento;
  const bAb = $("btnAbertura"), bFe = $("btnFechamento");

  bAb.className = ab ? "big done" : "big";
  bAb.querySelector(".t").textContent = ab ? "Deixado pronto ✓" : "Deixando pronto";
  bAb.querySelector(".s").textContent = ab
    ? "Registrado por " + ab.nome_responsavel + " às " + horaDe(ab.criado_em) + ". Toque para corrigir."
    : "Conte o que está na geladeira agora";

  bFe.className = fe ? "big done" : (ab ? "big" : "big ghost");
  bFe.querySelector(".t").textContent = fe ? "Turno fechado ✓" : "Fechando o turno";
  bFe.querySelector(".s").textContent = fe
    ? "Registrado por " + fe.nome_responsavel + " às " + horaDe(fe.criado_em) + ". Toque para ver o que saiu."
    : (ab ? "Conte o que sobrou no fim da noite" : "Só depois que alguém deixar a geladeira pronta");
  bFe.disabled = !ab && !fe;

  aviso("homeMsg","", "");
  show("scHome");
}
function horaDe(ts){
  return new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date(ts));
}

/* ============================================================
   CONTAGEM
   ============================================================ */
async function abrirContagem(momento){
  MOMENTO = momento;
  VALORES = {};

  const existente = CONTAGEM_HOJE[momento];
  if(existente){
    const { data } = await sb.from("jb_contagem_item").select("produto_id,qtd").eq("contagem_id", existente.id);
    (data || []).forEach(i => VALORES[i.produto_id] = i.qtd);
  } else {
    const r = localStorage.getItem(rascunhoKey());
    if(r){ try { VALORES = JSON.parse(r); } catch(e){} }
  }

  $("countTitle").textContent = momento === "abertura" ? "O que estou deixando" : "O que sobrou";
  aviso("countMsg",
    existente ? "Você está corrigindo uma contagem já salva." :
    (Object.keys(VALORES).length ? "Recuperei o que você já tinha digitado." : ""),
    existente ? "warn" : "ok");

  montarLista();
  show("scCount");
}

function montarLista(){
  const box = $("countList");
  box.innerHTML = "";
  PRODUTOS.forEach(p => {
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.pid = p.id;

    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = p.nome;
    row.appendChild(nome);

    const step = document.createElement("div");
    step.className = "step";

    const menos = document.createElement("button");
    menos.type = "button"; menos.textContent = "−"; menos.setAttribute("aria-label","Menos um " + p.nome);

    const inp = document.createElement("input");
    inp.type = "tel"; inp.inputMode = "numeric"; inp.maxLength = 3;
    inp.setAttribute("aria-label", p.nome);
    if(VALORES[p.id] !== undefined) inp.value = VALORES[p.id];

    const mais = document.createElement("button");
    mais.type = "button"; mais.textContent = "+"; mais.setAttribute("aria-label","Mais um " + p.nome);

    const set = v => {
      v = Math.max(0, Math.min(999, v));
      inp.value = v; VALORES[p.id] = v; salvarRascunho(); pintar();
    };
    menos.onclick = () => set((parseInt(inp.value,10) || 0) - 1);
    mais.onclick  = () => set((parseInt(inp.value,10) || 0) + 1);
    inp.oninput = () => {
      inp.value = inp.value.replace(/\D/g,"").slice(0,3);
      if(inp.value === "") delete VALORES[p.id];
      else VALORES[p.id] = parseInt(inp.value,10);
      salvarRascunho(); pintar();
    };
    inp.onfocus = () => inp.select();

    step.append(menos, inp, mais);
    row.appendChild(step);
    box.appendChild(row);
  });
  pintar();
}

function salvarRascunho(){
  try { localStorage.setItem(rascunhoKey(), JSON.stringify(VALORES)); } catch(e){}
}

function pintar(){
  let n = 0;
  document.querySelectorAll("#countList .item").forEach(row => {
    const pid = Number(row.dataset.pid);
    const ok = VALORES[pid] !== undefined;
    row.classList.toggle("filled", ok);
    if(ok) n++;
  });
  const total = PRODUTOS.length;
  $("countProg").textContent = n + " de " + total;
  $("countBar").style.width = (total ? (n/total*100) : 0) + "%";
  $("btnSalvar").disabled = n === 0;
  $("btnSalvar").textContent = n < total ? "Salvar (" + (total-n) + " em branco)" : "Salvar contagem";
}

async function salvar(){
  const btn = $("btnSalvar");
  const rotulo = btn.textContent;
  btn.disabled = true; btn.textContent = "Salvando...";

  const faltam = PRODUTOS.filter(p => VALORES[p.id] === undefined);
  if(faltam.length){
    const ok = confirm(faltam.length + " produto(s) ficaram em branco e vão contar como zero. Salvar assim?");
    if(!ok){ btn.disabled = false; btn.textContent = rotulo; return; }
    faltam.forEach(p => VALORES[p.id] = 0);
  }

  try{
    let id = CONTAGEM_HOJE[MOMENTO] ? CONTAGEM_HOJE[MOMENTO].id : null;
    if(id){
      const { error } = await sb.from("jb_contagem")
        .update({ atualizado_em: new Date().toISOString(), nome_responsavel: EU.nome }).eq("id", id);
      if(error) throw error;
    } else {
      const { data, error } = await sb.from("jb_contagem").insert({
        data: hojeSP(), momento: MOMENTO,
        registrado_por: EU.user_id, nome_responsavel: EU.nome
      }).select("id").single();
      if(error) throw error;
      id = data.id;
    }

    const linhas = PRODUTOS.map(p => ({ contagem_id: id, produto_id: p.id, qtd: VALORES[p.id] || 0 }));
    const { error: e2 } = await sb.from("jb_contagem_item").upsert(linhas, { onConflict: "contagem_id,produto_id" });
    if(e2) throw e2;

    localStorage.removeItem(rascunhoKey());

    if(MOMENTO === "fechamento"){ await mostrarResultado(hojeSP()); }
    else { await carregarHome(); aviso("homeMsg","Contagem de abertura salva.","ok"); }
  } catch(err){
    btn.disabled = false; btn.textContent = rotulo;
    aviso("countMsg", "Não consegui salvar agora. O que você digitou está guardado no celular, tente de novo em instantes.", "err");
    window.scrollTo(0,0);
    return;
  }
  btn.disabled = false; btn.textContent = "Salvar contagem";
}

/* ============================================================
   RESULTADO
   ============================================================ */
async function mostrarResultado(dia){
  const { data } = await sb.from("jb_saidas").select("*").eq("data", dia).order("ordem");
  const linhas = data || [];
  const total = linhas.reduce((s,l) => s + (l.saiu > 0 ? l.saiu : 0), 0);
  const negativos = linhas.filter(l => l.saiu < 0);

  let html = '<div class="res"><div class="hd">' +
             '<span class="script">Um doce dia</span>' +
             '<span class="v">' + total + ' ' + (total === 1 ? "item" : "itens") + '</span>' +
             '<span class="k">saíram da geladeira em ' + dataCurta(dia) + '</span></div>';
  linhas.forEach(l => {
    html += '<div class="ln' + (l.saiu === 0 ? " zero" : "") + '"><span></span><span class="q">' + l.saiu + '</span></div>';
  });
  html += "</div>";

  const box = $("resBox");
  box.innerHTML = html;
  const lns = box.querySelectorAll(".res .ln");
  linhas.forEach((l,i) => { if(lns[i]) lns[i].firstChild.textContent = l.produto; });

  if(negativos.length){
    const w = document.createElement("div");
    w.className = "msg warn";
    w.textContent = "Atenção: " + negativos.length + " produto(s) com sobra maior que o inicial. Provavelmente entrou reposição durante o turno ou houve erro de contagem. Vale conferir amanhã.";
    box.prepend(w);
  }
  show("scRes");
}

/* ============================================================
   HISTÓRICO
   ============================================================ */
async function abrirHistorico(){
  const { data } = await sb.from("jb_contagem")
    .select("data,momento").order("data",{ascending:false}).limit(40);
  const porDia = {};
  (data || []).forEach(c => { (porDia[c.data] = porDia[c.data] || {})[c.momento] = true; });
  const dias = Object.keys(porDia).sort().reverse().slice(0,14);

  const box = $("histList");
  box.innerHTML = "";
  if(!dias.length){
    const p = document.createElement("p");
    p.className = "tip"; p.style.margin = "10px 0";
    p.textContent = "Ainda não há contagem registrada.";
    box.appendChild(p);
  }
  dias.forEach(d => {
    const row = document.createElement("div"); row.className = "h";
    const dt = document.createElement("span"); dt.className = "dt"; dt.textContent = dataCurta(d);
    const st = document.createElement("span");
    const completo = porDia[d].abertura && porDia[d].fechamento;
    st.className = "st" + (completo ? " ok" : "");
    st.textContent = completo ? "fechado ✓" : (porDia[d].abertura ? "sem fechamento" : "só fechamento");
    row.append(dt, st);
    if(completo) { row.style.cursor = "pointer"; row.onclick = () => mostrarResultado(d); }
    box.appendChild(row);
  });
  show("scHist");
}

/* ============================================================
   LIGAÇÕES
   ============================================================ */
$("btnEntrar").onclick = entrar;
$("pin").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
$("btnSair").onclick = async () => { await sb.auth.signOut(); montarLogin(); show("scLogin"); };
$("btnAbertura").onclick = () => abrirContagem("abertura");
$("btnFechamento").onclick = () => {
  if(CONTAGEM_HOJE.fechamento) mostrarResultado(hojeSP());
  else abrirContagem("fechamento");
};
$("btnHist").onclick = abrirHistorico;
$("btnHistVoltar").onclick = carregarHome;
$("btnSalvar").onclick = salvar;
$("btnVoltar").onclick = carregarHome;
$("btnResOk").onclick = carregarHome;

iniciar();
</script>
